name: local-voicemode-llm

services:
  dashboard:
    build:
      context: .
      target: dashboard
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
        APP_VERSION: ${APP_VERSION:-dev}
        VCS_REF: ${VCS_REF:-unknown}
    environment:
      PORT: "7862"
      SUPERTONIC_URL: ${DOCKER_SUPERTONIC_URL:-http://host.docker.internal:8766}
      PARAKEET_URL: ${DOCKER_PARAKEET_URL:-http://host.docker.internal:5093}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-7862}:7862"
    volumes:
      - voicemode_config:/home/voicemode/.config/opencode
      - voicemode_cache:/home/voicemode/.cache
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:7862/', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  voicemode_config:
    name: ${VOICEMODE_CONFIG_VOLUME:-local-voicemode-config}
  voicemode_cache:
    name: ${VOICEMODE_CACHE_VOLUME:-local-voicemode-cache}
