name: Build Windows executables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "setup.ps1"
      - "windows/**"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build branded Windows executables
        shell: powershell
        run: .\windows\build-release.ps1 -InstallBuildTools

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: LocalVoiceModeLLM-Windows
          path: dist/windows/
          if-no-files-found: error
